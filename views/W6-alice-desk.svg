<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc"><title id="title">W6 — размерная схема стола Алисы</title><desc id="desc">Вид сверху и со стороны комнаты. Стол 2975 на 600, высота 740, модуль комода 1000 мм. Размеры из модели, не для изготовления.</desc><style>text{font-family:Arial,sans-serif;fill:#343b32}.title{font:42px Georgia,serif}.small{font-size:17px}.label{font-size:20px}.dim{font-size:18px;font-weight:600}.line{stroke:#53604c;stroke-width:1.4;fill:none}.muted{fill:#686e61}</style><rect width="1200" height="1420" fill="#faf7f0"/><text x="60" y="52" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">W6 / МЕБЕЛЬ / 01</text><text x="60" y="110" class="title" font-family="Georgia,serif" font-size="42" fill="#343b32" text-anchor="start">Стол у окна. Размерная схема.</text><text x="60" y="147" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Все размеры — мм. По текущей модели; не обмер и не чертёж для производства.</text><text x="60" y="217" class="label" font-family="Arial,sans-serif" font-size="20" fill="#343b32" text-anchor="start">01 / ВИД СВЕРХУ</text><text x="60" y="247" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Окно сверху схемы; комод — со стороны простенка между комнатами.</text><rect x="115" y="300" width="863.0000000000001" height="20" fill="#e4e5dc" stroke="#7f8875"/><rect x="275.6" y="300" width="471.24000000000007" height="20" fill="#dce7e5" stroke="#7f8875"/><rect x="130" y="330" width="833.0000000000001" height="168.00000000000003" fill="#e7d6be" stroke="#7f8875"/><rect x="130" y="330" width="280" height="168.00000000000003" fill="none" stroke="#7f8875"/><rect x="955.1600000000001" y="339.8" width="7.840000000000001" height="148.4" fill="#b6baa5" stroke="#7f8875"/><path d="M410 330L410 498" stroke="#53604c" stroke-width="1.4" fill="none" stroke-dasharray="6 5"/><path d="M410 470L952.9200000000001 470" stroke="#53604c" stroke-width="1.4" fill="none" stroke-dasharray="6 5"/><rect x="443.6" y="337.84" width="25.200000000000003" height="2.24" fill="#46533d" stroke="#7f8875"/><path d="M130 285L963.0000000000001 285" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M126 290L134 280" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M959.0000000000001 290L967.0000000000001 280" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="546.5" y="276" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle">2975</text><path d="M1030 330L1030 498" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M1025 334L1035 326" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M1025 502L1035 494" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="1019" y="414" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle" transform="rotate(-90 1019 414)">600</text><path d="M130 545L410 545" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M126 550L134 540" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M406 550L414 540" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="270" y="536" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle">1000 / модуль комода</text><path d="M410 545L963.0000000000001 545" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M406 550L414 540" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M959.0000000000001 550L967.0000000000001 540" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="686.5" y="536" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle">1975 / рабочая часть</text><text x="270" y="425" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="middle">КОМОД ПОД СТОЛОМ</text><text x="686.5" y="425" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="middle">РАБОЧАЯ ПОВЕРХНОСТЬ</text><path d="M456.20000000000005 338.96L456.20000000000005 590" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="468.20000000000005" y="590" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Кабельный вывод в модели: 90 × 8</text><text x="60" y="670" class="label" font-family="Arial,sans-serif" font-size="20" fill="#343b32" text-anchor="start">02 / ВИД ИЗ КОМНАТЫ НА ОКНО</text><text x="60" y="700" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Комод справа; проекция развёрнута относительно вида сверху.</text><rect x="346.16" y="760" width="471.24000000000007" height="82" fill="#e7efeb" stroke="#7f8875"/><path d="M346.16 754L346.16 842" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M817.4000000000001 754L817.4000000000001 842" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M346.16 842L817.4000000000001 842" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="581.7800000000001" y="787" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="middle">ОКНО / НИЖНЯЯ ЧАСТЬ</text><rect x="130" y="872.8" width="833.0000000000001" height="9.520000000000001" fill="#c5ad88" stroke="#7f8875"/><rect x="130" y="885.12" width="7.840000000000001" height="194.88000000000002" fill="#b6baa5" stroke="#7f8875"/><rect x="684.12" y="883.4399999999999" width="277.76000000000005" height="179.76000000000002" fill="#d9ddce" stroke="#7f8875"/><rect x="685.52" y="1003.28" width="274.96000000000004" height="56.56" fill="#ebece4" stroke="#7f8875"/><path d="M767 1007.2L879 1007.2" stroke="#53604c" stroke-width="1.4" fill="none" /><rect x="685.52" y="944.2" width="274.96000000000004" height="56.56" fill="#ebece4" stroke="#7f8875"/><path d="M767 948.12L879 948.12" stroke="#53604c" stroke-width="1.4" fill="none" /><rect x="685.52" y="885.12" width="274.96000000000004" height="56.56" fill="#ebece4" stroke="#7f8875"/><path d="M767 889.04L879 889.04" stroke="#53604c" stroke-width="1.4" fill="none" /><rect x="690" y="1063.2" width="266" height="16.8" fill="#a6ac9b" stroke="#7f8875"/><rect x="140.08" y="884" width="542.9200000000001" height="14.000000000000002" fill="#b5aa90" stroke="#7f8875"/><text x="178" y="944.8" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Открытая зона под столом</text><text x="178" y="973.8" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Балка показана условно</text><path d="M108 1080L985.0000000000001 1080" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M90 872.8L90 1080" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M85 876.8L95 868.8" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M85 1084L95 1076" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="79" y="976.4" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle" transform="rotate(-90 79 976.4)">740</text><path d="M1050 842L1050 1080" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M1045 846L1055 838" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M1045 1084L1055 1076" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="1039" y="961" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle" transform="rotate(-90 1039 961)">850 / подоконник</text><path d="M137.84 1130L683 1130" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M133.84 1135L141.84 1125" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M679 1135L687 1125" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="410.42" y="1121" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle">1947 / по модульной схеме</text><path d="M683 1130L963.0000000000001 1130" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M679 1135L687 1125" stroke="#53604c" stroke-width="1.4" fill="none" /><path d="M959.0000000000001 1135L967.0000000000001 1125" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="823" y="1121" class="dim" font-family="Arial,sans-serif" font-size="18" fill="#343b32" text-anchor="middle">1000</text><text x="130" y="1170" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Столешница: 34. Торцевая опора: 28. Зона под балкой в модели: 650 по высоте.</text><path d="M60 1210L1140 1210" stroke="#53604c" stroke-width="1.4" fill="none" /><text x="60" y="1250" class="label" font-family="Arial,sans-serif" font-size="20" fill="#343b32" text-anchor="start">ДО ЗАКАЗА МЕБЕЛИ</text><text x="60" y="1282" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Обмерить стену и откосы; проверить створки, радиатор, трубы и доступ к вентилям.</text><text x="60" y="1312" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Высоту рабочего места подобрать под рост Алисы. Монтажные зазоры здесь не заложены.</text><text x="60" y="1342" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">Опирание, усиление пролёта и крепёж рассчитывает изготовитель после выбора материала.</text><text x="60" y="1385" class="small" font-family="Arial,sans-serif" font-size="17" fill="#343b32" text-anchor="start">W6 · Эскиз для согласования · Геометрия совпадает с параметрами интерактивной модели</text></svg>