<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Кухня / композиционная развёртка</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Кухня / композиционная развёртка</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ad5747">Предварительное задание для согласования / не для монтажа</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / J01</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">1:20 / A3 / печать 100%</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 17</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><rect x="65" y="178" width="328.8188976377953" height="382.6771653543308" fill="#efeee7" stroke="#bfc4bc" stroke-width="1"/><rect x="65.0" y="437.0866141732284" width="85.03937007874018" height="112.25196850393702" fill="#b69d7d" stroke="#292e2a" stroke-width="0.65"/><rect x="150.03937007874018" y="437.0866141732284" width="85.03937007874018" height="112.25196850393702" fill="#b69d7d" stroke="#292e2a" stroke-width="0.65"/><rect x="235.07874015748035" y="437.0866141732284" width="66.61417322834647" height="112.25196850393702" fill="#b69d7d" stroke="#292e2a" stroke-width="0.65"/><rect x="65.0" y="433.11811023622056" width="236.6929133858268" height="3.968503937007875" fill="#d9d5c5" stroke="#292e2a" stroke-width="0.65"/><rect x="301.69291338582684" y="263.03937007874015" width="92.12598425196852" height="297.63779527559063" fill="#f0eee6" stroke="#292e2a" stroke-width="0.65"/><rect x="65.0" y="206.3464566929134" width="235.98425196850397" height="109.13385826771656" fill="#f0eee6" stroke="#292e2a" stroke-width="0.65"/><rect x="152.87401574803152" y="253.82677165354332" width="64.48818897637797" height="51.0236220472441" fill="#5e5549" stroke="#292e2a" stroke-width="0.65"/><text x="65" y="585.6771653543308" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">2320 мм</text><text x="590" y="175" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Размерная основа</text><text x="590" y="204" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Северная линия 2320. Нижняя рабочая отметка 900; верхние модули</text><text x="590" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">1730–2500; холодильный модуль 2100. Фартук и боковая линия показаны в</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">3D. Схема не содержит монтажных размеров приборов.</text><text x="590" y="288" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Что уточнить в рабочем узле</text><text x="590" y="317" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Развёртка задаёт композицию и основные отметки. Производитель</text><text x="590" y="337" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">выпускает деталировку, присадки, фурнитуру, компенсационные зазоры,</text><text x="590" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">крепления и допуски после контрольного обмера.</text></svg>