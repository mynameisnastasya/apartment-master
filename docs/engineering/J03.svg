<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Санузел / северная стена</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Санузел / северная стена</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ad5747">Предварительное задание для согласования / не для монтажа</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / J03</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">1:20 / A3 / печать 100%</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 19</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><rect x="65" y="178" width="323.1496062992127" height="382.6771653543308" fill="#efeee7" stroke="#bfc4bc" stroke-width="1"/><rect x="67.83464566929133" y="455.0866141732284" width="85.03937007874018" height="55.98425196850395" fill="#b69d7d" stroke="#292e2a" stroke-width="0.65"/><rect x="67.83464566929133" y="447.57480314960634" width="85.03937007874018" height="6.803149606299214" fill="#b69d7d" stroke="#292e2a" stroke-width="0.65"/><rect x="158.5433070866142" y="433.11811023622056" width="92.12598425196852" height="127.55905511811027" fill="#aaa89d" stroke="#292e2a" stroke-width="0.65"/><rect x="74.92125984251969" y="263.748031496063" width="70.86614173228348" height="126.14173228346459" fill="#b4c3be" stroke="#292e2a" stroke-width="0.65"/><rect x="287.51968503937013" y="329.65354330708664" width="94.96062992125987" height="51.0236220472441" fill="#625d53" stroke="#292e2a" stroke-width="0.65"/><text x="65" y="585.6771653543308" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">2280 мм</text><text x="590" y="175" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Размерная основа</text><text x="590" y="204" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Тумба 600; стиральный модуль 650; верх чаши около +906 по геометрии</text><text x="590" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">визуализации. Паспортные выводы и облицовочная раскладка не назначены.</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Высоты визуализации и условного мебельного объекта необходимо свести</text><text x="590" y="264" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">до заказа.</text><text x="590" y="308" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Что уточнить в рабочем узле</text><text x="590" y="337" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Развёртка задаёт композицию и основные отметки. Производитель</text><text x="590" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">выпускает деталировку, присадки, фурнитуру, компенсационные зазоры,</text><text x="590" y="377" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">крепления и допуски после контрольного обмера.</text></svg>