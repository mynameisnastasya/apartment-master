<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Свет и выключатели / высотные привязки</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Свет и выключатели / высотные привязки</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ad5747">Предварительное задание для согласования / не для монтажа</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / S02</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Схема</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 21</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><rect x="48" y="175" width="65" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="56" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ID</text><rect x="113" y="175" width="610" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="121" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">Функция</text><rect x="723" y="175" width="140" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="731" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">X</text><rect x="863" y="175" width="140" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="871" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">Y</text><rect x="1003" y="175" width="135" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="1011" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">H от ЧП</text><text x="56" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S01</text><text x="121" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Кухня: общий / подвес / рабочий</text><text x="731" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">2470</text><text x="871" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">2040</text><text x="1011" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">900</text><line x1="48" y1="242" x2="1138" y2="242" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="259" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S02</text><text x="121" y="259" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Гостиная: общий / камень</text><text x="731" y="259" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">0</text><text x="871" y="259" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">4420</text><text x="1011" y="259" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">900</text><line x1="48" y1="282" x2="1138" y2="282" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S03</text><text x="121" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Прихожая: общий / зеркало</text><text x="731" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">6400</text><text x="871" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">1180</text><text x="1011" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">900</text><line x1="48" y1="322" x2="1138" y2="322" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="339" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S04</text><text x="121" y="339" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Спальня: общий / изголовье</text><text x="731" y="339" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">3175</text><text x="871" y="339" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">4870</text><text x="1011" y="339" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">900</text><line x1="48" y1="362" x2="1138" y2="362" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="379" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S05</text><text x="121" y="379" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">У кровати: общий / изголовье / лампа</text><text x="731" y="379" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">3175</text><text x="871" y="379" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">5740</text><text x="1011" y="379" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">700</text><line x1="48" y1="402" x2="1138" y2="402" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="419" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S06</text><text x="121" y="419" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Детская: общий / стол</text><text x="731" y="419" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">5840</text><text x="871" y="419" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">3640</text><text x="1011" y="419" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">900</text><line x1="48" y1="442" x2="1138" y2="442" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S07</text><text x="121" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">У кровати: общий / лампа</text><text x="731" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">6400</text><text x="871" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">6100</text><text x="1011" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">700</text><line x1="48" y1="482" x2="1138" y2="482" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="499" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">S08</text><text x="121" y="499" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Санузел: общий / зеркало / ниша</text><text x="731" y="499" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">2850</text><text x="871" y="499" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">2040</text><text x="1011" y="499" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">900</text><line x1="48" y1="522" x2="1138" y2="522" stroke="#bfc4bc" stroke-width="0.6"/><text x="55" y="570" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#686d65">Проводные связи у кроватей и входов проектировать как проходное или релейное управление после выбора системы. Каналы сценариев должны</text><text x="55" y="591" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#686d65">оставаться понятными без приложения. Подсветки по группам диммируются только с совместимыми драйверами.</text><text x="55" y="637" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#686d65">Привязки S01–S08 — авторское предложение. Проверить накладки, наличники, открывание дверей, высоту кроватей, доступность для ребёнка и</text><text x="55" y="658" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#686d65">возможность обслуживания.</text></svg>