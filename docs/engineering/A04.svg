.3464566929134" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L09</text><circle cx="258.37795275590554" cy="494.51968503937013" r="5" fill="#fff7e3" stroke="#9b6b44"/><text x="266.37795275590554" y="489.51968503937013" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L10</text><circle cx="342.2834645669292" cy="464.4724409448819" r="5" fill="#fff7e3" stroke="#9b6b44"/><text x="350.2834645669292" y="459.4724409448819" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L11</text><circle cx="444.8976377952756" cy="513.228346456693" r="5" fill="#fff7e3" stroke="#9b6b44"/><text x="452.8976377952756" y="508.228346456693" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L12</text><circle cx="342.2834645669292" cy="569.9212598425197" r="5" fill="#fff7e3" stroke="#9b6b44"/><text x="350.2834645669292" y="564.9212598425197" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L13</text><circle cx="288.4251968503937" cy="232.03149606299212" r="5" fill="#fff7e3" stroke="#9b6b44"/><text x="296.4251968503937" y="227.03149606299212" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L14</text><circle cx="246.4724409448819" cy="169.66929133858267" r="5" fill="#fff7e3" stroke="#9b6b44"/><text x="254.4724409448819" y="164.66929133858267" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L15</text><circle cx="334.9133858267717" cy="166.83464566929135" r="5" fill="#fff7e3" stroke="#9b6b44"/><text x="342.9133858267717" y="161.83464566929135" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#9b6b44">L16</text><text x="590" y="175" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">C01 / спокойная плоскость</text><text x="590" y="204" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Потолок без случайной сетки спотов. Высота основания в модели 2700.</text><text x="590" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Чистовую отметку определить после трасс и светильников; цифра 2600 у</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">потолочных точек — проектный ориентир, не заказ потолка.</text><text x="590" y="288" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Скрытые линии</text><text x="590" y="317" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">L03 кухня; L04 камень гостиной; L09 лунное изголовье; L13 рабочее место;</text><text x="590" y="337" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">L15 зеркало; L16 ниша. Блоки питания доступны для обслуживания, не</text><text x="590" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">замурованы.</text><text x="590" y="401" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Световая спецификация</text><text x="590" y="430" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Тёплый белый ориентировочно 3000 K, качественная цветопередача CRI ≥ 90</text><text x="590" y="450" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">— пожелание к подбору. Мощности предварительные; освещённость и</text><text x="590" y="470" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">пульсацию проверять по фотометрии выбранных изделий.</text></svg>