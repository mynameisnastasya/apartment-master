<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Материалы и заказные элементы</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Материалы и заказные элементы</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ad5747">Предварительное задание для согласования / не для монтажа</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / S01</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Схема</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 20</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><rect x="48" y="175" width="60" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="56" y="193" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">Код</text><rect x="108" y="175" width="290" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="116" y="193" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">Материал / элемент</text><rect x="398" y="175" width="310" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="406" y="193" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">Применение</text><rect x="708" y="175" width="430" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="716" y="193" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">Условие заказа</text><text x="56" y="219" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">M01</text><text x="116" y="219" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Дымчатый дуб</text><text x="406" y="219" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Фасады, полки, изголовье</text><text x="716" y="219" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Образец шпона + выкраса; ориентация волокон</text><line x1="48" y1="244" x2="1138" y2="244" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="261" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">M02</text><text x="116" y="261" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Палевая минеральная поверхность</text><text x="406" y="261" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Столешница и кухонный фартук</text><text x="716" y="261" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Устойчивость к пятнам; карта стыков и кромок</text><line x1="48" y1="286" x2="1138" y2="286" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="303" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">M03</text><text x="116" y="303" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Минеральный рельеф</text><text x="406" y="303" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Медиастена и серп спальни</text><text x="716" y="303" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Образец фактуры 1:1; масса и крепление</text><line x1="48" y1="328" x2="1138" y2="328" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="345" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">M04</text><text x="116" y="345" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Тёмный камень / керамогранит</text><text x="406" y="345" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Санузел</text><text x="716" y="345" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Формат и раскладка после обмера; мокрые зоны</text><line x1="48" y1="370" x2="1138" y2="370" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="387" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">M05</text><text x="116" y="387" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Лён / шерсть / мягкая обивка</text><text x="406" y="387" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Кровати, диван, ковёр</text><text x="716" y="387" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Износостойкость, чистка, пожарные показатели</text><line x1="48" y1="412" x2="1138" y2="412" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="429" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">M06</text><text x="116" y="429" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Матовая бронза</text><text x="406" y="429" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Свет, смесители, детали</text><text x="716" y="429" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Согласовать один оттенок по реальным образцам</text><line x1="48" y1="454" x2="1138" y2="454" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="471" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">J01</text><text x="116" y="471" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Полуостров 1100 × 650 × 760</text><text x="406" y="471" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Кухня</text><text x="716" y="471" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Каменная крышка 62; устойчивость основания</text><line x1="48" y1="496" x2="1138" y2="496" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="513" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">J02</text><text x="116" y="513" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Панель 2260 × 2460</text><text x="406" y="513" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Спальня</text><text x="716" y="513" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Скрытые драйверы доступны; крепление рельефа</text><line x1="48" y1="538" x2="1138" y2="538" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="555" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">J03</text><text x="116" y="555" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Тумба 600 × 400</text><text x="406" y="555" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Санузел</text><text x="716" y="555" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Влагостойкая конструкция; ревизия сифона</text><line x1="48" y1="580" x2="1138" y2="580" stroke="#bfc4bc" stroke-width="0.6"/><text x="55" y="690" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#686d65">Бренды, артикулы, цены и сроки не выдуманы: закупочная спецификация формируется после утверждения реальных образцов и бюджета. Двери, шторы и встроенная мебель</text><text x="55" y="707" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#686d65">— только после обмера.</text></svg>