<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Электрика: расчётные сценарии и задание инженеру</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Электрика: расчётные сценарии и задание инженеру</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ad5747">Предварительное задание для согласования / не для монтажа</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / E07</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Схема</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 12</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><rect x="48" y="175" width="770" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="56" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">Сценарий (не нормативный коэффициент спроса)</text><rect x="818" y="175" width="160" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="826" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">P, кВт</text><rect x="978" y="175" width="160" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="986" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">I при 230 В, А</text><text x="56" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Базовый свет + холод + связь</text><text x="826" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">0.810</text><text x="986" y="219" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">3.5</text><line x1="48" y1="247" x2="1138" y2="247" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="264" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Готовка: база + 50% варочной + духовка + чайник</text><text x="826" y="264" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">9.410</text><text x="986" y="264" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">40.9</text><line x1="48" y1="292" x2="1138" y2="292" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="309" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">Готовка + ПММ + стирка</text><text x="826" y="309" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">13.610</text><text x="986" y="309" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">59.2</text><line x1="48" y1="337" x2="1138" y2="337" stroke="#bfc4bc" stroke-width="0.6"/><text x="55" y="370" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Почему нельзя назначить ввод</text><text x="55" y="397" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Сумма установочных мощностей не равна расчётному спросу. Нет технических условий, фазности и данных существующего ввода. Вводной автомат и</text><text x="55" y="416" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">распределение по фазам не назначаются по этому альбому.</text><text x="55" y="459" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Что должен рассчитать ЭОМ</text><text x="55" y="486" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Нагрузки и спрос; защиту от поражения током; ток КЗ; отключающую способность и время отключения; селективность; кабели с учётом способа прокладки и</text><text x="55" y="505" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">группировки; падение напряжения; УДТ / УЗДП / УЗИП по применимости; PE и уравнивание потенциалов.</text><text x="55" y="548" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Трассы и закупка</text><text x="55" y="575" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Метраж кабеля, номиналы автоматов и комплектация щита не выдуманы. Выпускаются после обмера, выбора трасс и расчёта. На плане показаны</text><text x="55" y="594" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">потребительские точки, а не монтажные маршруты.</text></svg>