3228346456693" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="372.7952755905512" y="209.3228346456693" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L07</text><circle cx="169.3700787401575" cy="532.5039370078741" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="174.3700787401575" y="528.5039370078741" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L08</text><circle cx="264.0472440944882" cy="552.3464566929134" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="269.0472440944882" y="548.3464566929134" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L09</text><circle cx="258.37795275590554" cy="494.51968503937013" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="263.37795275590554" y="490.51968503937013" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L10</text><circle cx="342.2834645669292" cy="464.4724409448819" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="347.2834645669292" y="460.4724409448819" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L11</text><circle cx="444.8976377952756" cy="513.228346456693" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="449.8976377952756" y="509.228346456693" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L12</text><circle cx="342.2834645669292" cy="569.9212598425197" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="347.2834645669292" y="565.9212598425197" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L13</text><circle cx="288.4251968503937" cy="232.03149606299212" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="293.4251968503937" y="228.03149606299212" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L14</text><circle cx="246.4724409448819" cy="169.66929133858267" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="251.4724409448819" y="165.66929133858267" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L15</text><circle cx="334.9133858267717" cy="166.83464566929135" r="3" fill="#faf9f5" stroke="#292e2a"/><text x="339.9133858267717" y="162.83464566929135" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#292e2a">L16</text><text x="590" y="175" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Это связи управления</text><text x="590" y="204" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Пунктир связывает выключатель с потребителем, а не показывает трассу</text><text x="590" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">кабеля. Тип управления, проходные схемы, диммеры и совместимость</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">драйверов определяет проект ЭОМ.</text><text x="590" y="288" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Три сценария</text><text x="590" y="317" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">День: общий + рабочий. Вечер: камень, изголовье, зеркало; общий</text><text x="590" y="337" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">приглушён. Ночь: локальный свет у кроватей. У входов и у кроватей</text><text x="590" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">предусмотрен доступ к основному свету.</text><text x="590" y="401" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S01 / Кухня: общий / подвес / рабочий</text><text x="590" y="426" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S02 / Гостиная: общий / камень</text><text x="590" y="451" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S03 / Прихожая: общий / зеркало</text><text x="590" y="476" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S04 / Спальня: общий / изголовье</text><text x="590" y="501" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S05 / У кровати: общий / изголовье / лампа</text><text x="590" y="526" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S06 / Детская: общий / стол</text><text x="590" y="551" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S07 / У кровати: общий / лампа</text><text x="590" y="576" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">S08 / Санузел: общий / зеркало / ниша</text></svg>