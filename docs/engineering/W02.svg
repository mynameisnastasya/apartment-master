ont-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Ванна</text><text x="391" y="602" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">ХВС + ГВС + К1</text><text x="616" y="602" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">По монтажной карте смесителя</text><line x1="48" y1="617" x2="1138" y2="617" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="634" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">W06</text><text x="116" y="634" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Унитаз / инсталляция</text><text x="391" y="634" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">ХВС + К1</text><text x="616" y="634" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">По паспорту инсталляции</text><line x1="48" y1="649" x2="1138" y2="649" stroke="#bfc4bc" stroke-width="0.6"/><text x="55" y="703" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#686d65">Предусмотреть доступную запорную арматуру, ревизии и защиту от протечек как проектное предложение. Фильтры, редукторы, коллекторы, диаметры и насосы не назначены без давления,</text><text x="55" y="718" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#686d65">расхода и обследования.</text></svg>