<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Спальня / стена изголовья</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Спальня / стена изголовья</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ad5747">Предварительное задание для согласования / не для монтажа</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / J02</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">1:20 / A3 / печать 100%</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 18</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><rect x="65" y="178" width="320.3149606299213" height="360.00000000000006" fill="#efeee7" stroke="#bfc4bc" stroke-width="1"/><rect x="65.0" y="178.0" width="320.3149606299213" height="348.6614173228347" fill="#b69d7d" stroke="#292e2a" stroke-width="0.65"/><rect x="93.34645669291339" y="389.1811023622048" width="263.6220472440945" height="86.45669291338584" fill="#dad2bf" stroke="#292e2a" stroke-width="0.65"/><circle cx="233.66141732283467" cy="287.13385826771656" r="109.13385826771656" fill="none" stroke="#9b6b44"/><text x="115" y="248" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Габарит рельефа Ø1540</text><text x="65" y="563.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">2260 мм</text><text x="590" y="175" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Размерная основа</text><text x="590" y="204" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Панель 2260 × 2460; низ панели +80. Рельеф: габарит Ø1540, центр +1770.</text><text x="590" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Мягкая часть +440…+1050. Круг — габарит рельефа, не шаблон серпа.</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Крепление по расчёту массы и основания.</text><text x="590" y="288" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Что уточнить в рабочем узле</text><text x="590" y="317" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Развёртка задаёт композицию и основные отметки. Производитель</text><text x="590" y="337" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">выпускает деталировку, присадки, фурнитуру, компенсационные зазоры,</text><text x="590" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">крепления и допуски после контрольного обмера.</text></svg>