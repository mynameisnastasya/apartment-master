y="165.66929133858267" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#467b8b">W04</text><circle cx="338.3149606299213" cy="178.74015748031496" r="5" fill="#faf9f5" stroke="#467b8b"/><text x="346.3149606299213" y="174.74015748031496" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#467b8b">W05</text><circle cx="234.00000000000003" cy="244.50393700787401" r="5" fill="#faf9f5" stroke="#467b8b"/><text x="242.00000000000003" y="240.50393700787401" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#467b8b">W06</text><text x="590" y="175" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Шесть потребителей</text><text x="590" y="204" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">ХВС: 6 подключений. ГВС: 3 подключения — мойка, умывальник, ванна.</text><text x="590" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Канализация К1: 6 функциональных подключений; ПММ может</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">подключаться через сифон мойки по паспорту.</text><text x="590" y="288" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Стояки не указаны</text><text x="590" y="317" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Положение ввода, коллекторов, счётчиков и канализационного стояка не</text><text x="590" y="337" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">известно. Линии до них не проведены условно через стены. В этой</text><text x="590" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">геометрии инженерная реализуемость мокрых зон ещё не подтверждена.</text><text x="590" y="401" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Высоты и диаметры</text><text x="590" y="430" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Высоты выпусков, диаметры, уклоны и отметки труб определяются после</text><text x="590" y="450" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">выбора изделий и фактического положения стояка. На W02 —</text><text x="590" y="470" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">функциональная схема и требования к доступу.</text></svg>