<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Статус проекта и состав альбома</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Статус проекта и состав альбома</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#686d65">Планировка D и дизайн 01 утверждены заказчиком 29.09.2026</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / A00</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Схема</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 01</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><text x="55" y="178" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#292e2a" font-weight="700">Утверждено</text><text x="55" y="208" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">Планировочная логика D, мебельные габариты и дизайн 01 «Тихая геология». Утверждение относится к концепции, а не к инженерной</text><text x="55" y="230" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">готовности.</text><text x="55" y="282" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#292e2a" font-weight="700">Основа</text><text x="55" y="312" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">Условная модель около 50 м². Высота 2700 мм принята в модели. Стояки, вентшахты, выделенная мощность, заземление и конструкции</text><text x="55" y="334" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">не обследованы.</text><text x="55" y="386" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#292e2a" font-weight="700">Подготовлено</text><text x="55" y="416" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">Планы мебели, перегородок, полов и потолков; свет и управление; розетки и данные; баланс нагрузок; функциональная схема групп;</text><text x="55" y="438" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">сантехнические выводы; мокрые зоны; задание по вентиляции; развёртки и ведомости.</text><text x="55" y="490" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#292e2a" font-weight="700">До выпуска в монтаж</text><text x="55" y="520" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">Нужны обмер, план БТИ / застройщика, мокрые зоны соседей, расположение стояков и шахт, ввод и щит, выделенная мощность / фазы /</text><text x="55" y="542" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#686d65">система заземления, паспорта техники. Электрик и инженер ВК должны выполнить и подписать расчётные разделы.</text></svg>