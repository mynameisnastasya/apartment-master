<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190.551 841.89" role="img"><title>Нормативные источники и следующий выпуск</title><rect x="0" y="0" width="1190.551" height="841.89" fill="#faf9f5" stroke="none" stroke-width="1"/><text x="42" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a" font-weight="700">ЛЕСНАЯ ПОЛЯНА  /  ЛИЗА</text><text x="870" y="42" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#292e2a">D / 01   ·   ТИХАЯ ГЕОЛОГИЯ</text><line x1="42" y1="60" x2="1148.551" y2="60" stroke="#bfc4bc" stroke-width="1"/><text x="42" y="101" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#292e2a">Нормативные источники и следующий выпуск</text><text x="43" y="124" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ad5747">Предварительное задание для согласования / не для монтажа</text><rect x="42" y="756.89" width="1106.551" height="48" fill="none" stroke="#bfc4bc" stroke-width="1"/><text x="54" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">LP-D01 / R01</text><text x="280" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">29.09.2026  ·  Редакция 01</text><text x="550" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Схема</text><text x="850" y="776.89" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#292e2a">Лист 22</text><text x="54" y="795.89" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">Размеры в мм. Привязки проектные. Геометрия условная: требуется контрольный обмер.</text><rect x="48" y="175" width="330" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="56" y="193" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">Источник</text><rect x="378" y="175" width="760" height="27" fill="#e7e5dd" stroke="none" stroke-width="1"/><text x="386" y="193" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a" font-weight="700">Что изучено</text><text x="56" y="219" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">ГОСТ Р 21.101-2026</text><text x="386" y="219" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Общие правила оформления; действует с 01.04.2026</text><line x1="48" y1="234" x2="1138" y2="234" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="251" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">ГОСТ 21.608-2021</text><text x="386" y="251" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Состав документации внутреннего освещения</text><line x1="48" y1="266" x2="1138" y2="266" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="283" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">ГОСТ 21.210-2014</text><text x="386" y="283" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Графические изображения электрооборудования</text><line x1="48" y1="298" x2="1138" y2="298" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="315" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">ГОСТ 21.613-2014</text><text x="386" y="315" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Рабочая документация силового электрооборудования</text><line x1="48" y1="330" x2="1138" y2="330" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="347" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">ГОСТ 21.601-2011</text><text x="386" y="347" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Рабочая документация водоснабжения и канализации</text><line x1="48" y1="362" x2="1138" y2="362" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="379" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">СП 256.1325800.2016 / изм. 9</text><text x="386" y="379" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Электроустановки; изменение действует с 26.01.2026</text><line x1="48" y1="394" x2="1138" y2="394" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="411" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">СП 30.13330.2020</text><text x="386" y="411" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Внутренний водопровод и канализация</text><line x1="48" y1="426" x2="1138" y2="426" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="443" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Архитектурное бюро Доценко</text><text x="386" y="443" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Пример состава эскизного альбома интерьера</text><line x1="48" y1="458" x2="1138" y2="458" stroke="#bfc4bc" stroke-width="0.6"/><text x="56" y="475" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Dzik Design</text><text x="386" y="475" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#292e2a">Практика комплектации дизайн-проекта</text><line x1="48" y1="490" x2="1138" y2="490" stroke="#bfc4bc" stroke-width="0.6"/><text x="55" y="535" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Состав альбома ориентирован на практику российских дизайн-бюро и структуру СПДС. Условные обозначения в этом эскизном комплекте авторские и</text><text x="55" y="555" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">расшифрованы; полное соответствие рабочей документации ГОСТ не заявляется.</text><text x="55" y="597" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Следующий выпуск: обмер → проверка планировки и мокрых зон → технические условия → паспорта изделий → инженерные расчёты → координация → рабочие</text><text x="55" y="617" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">узлы → подписи ответственных специалистов.</text><text x="55" y="659" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Активные ссылки на первоисточники — в engineering.html и manifest.json. Дата исследования: 29.09.2026. Нормативная применимость уточняется инженером для</text><text x="55" y="679" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">конкретного объекта.</text></svg>