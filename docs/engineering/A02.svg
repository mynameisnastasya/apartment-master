ТСКАЯ</text><text x="263.4803149606299" y="257.54330708661416" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">03 / САНУЗЕЛ</text><line x1="90.0" y1="141.0" x2="452.8346456692914" y2="141.0" stroke="#686d65" stroke-width="0.65"/><line x1="87.0" y1="144.0" x2="93.0" y2="138.0" stroke="#686d65" stroke-width="0.65"/><line x1="449.8346456692914" y1="144.0" x2="455.8346456692914" y2="138.0" stroke="#686d65" stroke-width="0.65"/><text x="259.4173228346457" y="136.0" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">6400</text><line x1="90.0" y1="659.5511811023623" x2="270.0" y2="659.5511811023623" stroke="#686d65" stroke-width="0.65"/><line x1="87.0" y1="662.5511811023623" x2="93.0" y2="656.5511811023623" stroke="#686d65" stroke-width="0.65"/><line x1="267.0" y1="662.5511811023623" x2="273.0" y2="656.5511811023623" stroke="#686d65" stroke-width="0.65"/><text x="168.0" y="654.5511811023623" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">3175</text><line x1="284.1732283464567" y1="610.7952755905512" x2="452.8346456692914" y2="610.7952755905512" stroke="#686d65" stroke-width="0.65"/><line x1="281.1732283464567" y1="613.7952755905512" x2="287.1732283464567" y2="607.7952755905512" stroke="#686d65" stroke-width="0.65"/><line x1="449.8346456692914" y1="613.7952755905512" x2="455.8346456692914" y2="607.7952755905512" stroke="#686d65" stroke-width="0.65"/><text x="356.503937007874" y="605.7952755905512" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">2975</text><line x1="61.65354330708661" y1="164.0" x2="61.65354330708661" y2="634.5511811023623" stroke="#686d65" stroke-width="0.65"/><text x="31.653543307086608" y="394.0" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">8300</text><text x="90" y="681" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#292e2a">0</text><line x1="101" y1="676" x2="157.69291338582678" y2="676" stroke="#292e2a" stroke-width="3"/><text x="164" y="681" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#686d65">1 м  /  1:50 на A3</text><text x="590" y="175" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Монтажная идея</text><text x="590" y="204" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Коричневым показаны проектные перегородки D. Толщина 120 мм принята в</text><text x="590" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">модели. Материал и узлы примыкания выбрать после обследования</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">перекрытий и требований по звуку / влажности.</text><text x="590" y="288" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Дверные системы</text><text x="590" y="317" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Спальня: распашная дверь. Детская и санузел: кассетные раздвижные.</text><text x="590" y="337" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Карман двери нельзя занимать розетками, трубами или крепежом мебели;</text><text x="590" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">привязки S06 и S08 вынесены за карманы.</text><text x="590" y="401" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#292e2a" font-weight="700">Демонтаж не назначен</text><text x="590" y="430" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">Исходный обмер и конструктивная схема отсутствуют. Этот лист не</text><text x="590" y="450" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">разрешает снос стен, штрабление несущих конструкций или перенос мокрых</text><text x="590" y="470" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#686d65">зон.</text></svg>