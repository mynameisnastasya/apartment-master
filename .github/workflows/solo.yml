name: Solo apartment checks
on:
  push:
    paths: ['solo/**', 'solo.html', '.github/workflows/solo.yml']
  pull_request:
    paths: ['solo/**', 'solo.html', '.github/workflows/solo.yml']
permissions:
  contents: read
jobs:
  solo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node solo/qa.mjs
      - run: node solo/build.mjs
      - run: git diff --exit-code -- solo/app.bundle.js
      - run: npx playwright install --with-deps chromium
      - run: node solo/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solo-apartment-review
          path: test-results/solo/
