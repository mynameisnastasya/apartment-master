name: Build standalone site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.template.html'
      - 'project.template.html'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated site
        shell: bash
        run: |
          if git diff --quiet -- index.html model.html LIZA.html views/D-floor-plan.svg MASTER-APARTMENT.json; then
            echo "generated site is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html model.html LIZA.html views/D-floor-plan.svg MASTER-APARTMENT.json
          git commit -m "build: publish design album and model"
          git push
