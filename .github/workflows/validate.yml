name: Validate apartment model

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run qa
      - run: node scripts/appliance-qa.mjs
      - run: node scripts/ergonomic-qa.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/reference-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-browser-check
          path: browser-reference-artifacts/
